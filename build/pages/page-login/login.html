<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login In</title>
    <meta name="description" content="Сайт о криптовалютах сайт по Figma">
    <meta name="description" content="Login In - Sign Up">
    <link rel="stylesheet" type="text/css" href="../../style.css" >
    <link rel="icon" href="../../favicon.ico">
</head>
<body>
    <div class="wrapper wrapper-login">
        <h1 class="visually-hidden">Crypto Brains web-site for verstaem.online</h1>
        <div class="login container">
            <div class="login__content ">
                <div class="login__block">
                    <a href="../../index.html" class="logo-link">
                        <picture>
                            <source type="image/webp" srcset="../../assets/img/Logo_170_52.webp"  media="(max-width: 412px)">
                            <source type="image/png" srcset="../../assets/img/Logo_170_52.png" media="(max-width: 412px)">
                            <source type="image/webp" srcset="../../assets/img/Logo.webp">
                            <img class="logo-link__img" src="../../assets/img/Logo.png" alt="logo" width="150" height="46">
                        </picture>
                    </a>
                    <h2 class="login__title reset">Login</h2>
                    <form class="form reset" action="#" enctype="multipart/form-data" method="POST">
                        <div class="form__control">
                            <label class="form__label" for="user_phone">Email or Phone</label>
                            <input class="form__input" id="user_phone" required type="text" placeholder="Type Here">
                        </div>

                        <div class="form__control">
                            <label  class="form__label" for="user_password">Password</label>
                            <div class="form__password">
                                <input class="form__input" id="user_password"  type="password" required  placeholder="Type Here">
                                <div class="eye-closed"></div>
                            </div>
                        </div>

                        <button class="btn btn-primary login__button" id="submit" type="submit">Login</button>

                        <a class="login__forgot" href="forgot_password.html">Forgot Password?</a>
                        <label class="login__account">Don't Have an Account?
                            <a class="login__link" href="sign_up.html">Sign Up Here</a>
                        </label>
                    </form>
                </div>
                <div class="login__picture">
                    <img class="man-working" src="../../assets/img/Man_working_675.png" alt="Man_working_675.png" width="675" height="675">
                </div>
            </div>
            <div class="login-footer">©Copyright 2022 All Rights Are Reserved.</div>
        </div>
    </div>

    <script src="../../script.js"></script>
</body>
</html>
